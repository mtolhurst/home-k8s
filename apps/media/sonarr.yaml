---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-pvc
  labels:
    backup: daily
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-nfs-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain 
  storageClassName: manual
  mountOptions:
    - nfsvers=4.2
    - wsize=1048576 # Forces Talos to chunk writes into exactly 1MB blocks
    - rsize=1048576 # Matches read requests to the ZFS block layout
    - hard          # Prevents silent data corruption inside the pod if I/O pauses
    - noresvport    # Ensures stable reconnects over Cilium's host networking
  nfs:
    server: nas.kube.home
    path: /mnt/nas/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-nfs
  namespace: multimedia 
spec:
  accessModes:
    - ReadWriteMany
  volumeName: media-nfs-pv # Manually binds to the exact PV above
  storageClassName: manual
  resources:
    requests:
      storage: 1Gi

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: multimedia
  labels:
    app: sonarr
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sonarr-pvc
        - name: media
          persistentVolumeClaim:
            claimName:  media-nfs
        - name: tmp
          persistentVolumeClaim:
            claimName: media-tmp-pvc
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.19
          ports:
            - name: sonarr-http
              containerPort: 8989
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Australia/Sydney
          volumeMounts:
            - name: data
              mountPath: /config
            - name: media
              mountPath: /multimedia
            - name: tmp
              mountPath: /complete
              subPath: complete
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: sonarr
spec:
  ports:
    - port: 80
      protocol: TCP
      targetPort: sonarr-http
      name: sonarr-http
  selector:
    app: sonarr
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    cert-manager.io/cluster-issuer: dns-issuer
  name: sonarr-gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: sonarr.k8s.tolly-home.com
      tls:
        mode: Terminate
        certificateRefs:
        - kind: Secret
          name: sonarr-https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-sonarr
spec:
  parentRefs:
    - name: sonarr-gateway
  hostnames:
    - sonarr.k8s.tolly-home.com
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: sonarr
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: "60s"
