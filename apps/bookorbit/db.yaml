---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bookorbit-pg-cluster
spec:
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: versity-store
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  storage:
    size: 2Gi
  postgresql:
    extensions:
    - name: pgvector
      image:
        reference: ghcr.io/cloudnative-pg/pgvector:0.8.6-18-trixie
  bootstrap:
    initdb:
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
  
  # # Uncomment this, and comment out the spec.plugins block to restore from backup
    # recovery:
    #   source: bookorbit-pg-cluster
  # externalClusters:
  # - name: bookorbit-pg-cluster
  #   plugin:
  #     name: barman-cloud.cloudnative-pg.io
  #     parameters:
  #       barmanObjectName: versity-store
  #       serverName: bookorbit-pg-cluster
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: 
spec:
  name: app
  owner: app
  cluster:
    name: cluster-pgvector
  extensions:
  - name: vector
    # renovate: suite=trixie-pgdg depName=postgresql-18-pgvector extractVersion=^(?<version>\d+\.\d+\.\d+)
    version: '0.8.6'
---
apiVersion: v1
kind: Secret
metadata:
  name: versity-secret
  namespace: bookorbit
type: Opaque
data:
  AWS_ACCESS_KEY_ID: YWRtaW4=
  AWS_SECRET_ACCESS_KEY: YWRtaW4= 
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: versity-store
spec:
  configuration:
    destinationPath: s3://cnpg-backups/bookorbit/
    endpointURL: http://s3-gw.versitygw.svc.cluster.local
    s3Credentials:
      accessKeyId:
        name: versity-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: versity-secret
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: daily-backup
spec:
  schedule: "0 0 0 * * *"  # At midnight every day
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: bookorbit-pg-cluster

