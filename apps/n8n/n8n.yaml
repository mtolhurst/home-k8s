---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    backup: daily
  name: n8n-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-pvc
      containers:
        - name: n8n-server
          image: n8nio/n8n:2.48.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5678
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          env: 
            - name: N8N_HOST
              value: "n8n.k8s.tolly-home.com"
            - name: N8N_PORT
              value: "5678"
            - name: NODE_ENV
              value: "production"
            - name: N8N_WEBHOOK_URL
              value: https://n8n.k8s.tolly-home.com
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              valueFrom:
                secretKeyRef:
                  name: n8n-pg-cluster-app
                  key: host
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-pg-cluster-app
                  key: username
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-pg-cluster-app
                  key: password
            - name: DB_POSTGRESDB_PORT
              valueFrom:
                secretKeyRef:
                  name: n8n-pg-cluster-app
                  key: port
            - name: DB_POSTGRESDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: n8n-pg-cluster-app
                  key: dbname

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: n8n
spec:
  ports:
    - port: 80
      protocol: TCP
      targetPort: http
  selector:
    app: n8n
  sessionAffinity: None
  type: ClusterIP

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    cert-manager.io/cluster-issuer: dns-issuer
  name: n8n-gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: n8n.k8s.tolly-home.com
      tls:
        mode: Terminate
        certificateRefs:
        - kind: Secret
          name: n8n-https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
spec:
  parentRefs:
    - name: n8n-gateway
  hostnames:
    - n8n.k8s.tolly-home.com
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: n8n
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
