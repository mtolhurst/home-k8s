apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: cluster-lb-pool
  namespace: kube-system
spec:
  cidrs:
    - cidr: "10.2.16.0/24" 
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumBGPPeeringPolicy
metadata:
  name: bgp-peering-policy
  namespace: kube-system
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  virtualRouters:
    - localASN: 64501 
      exportPodCIDR: false
      neighbors:
        - peerAddress: "192.168.2.1/32" 
          peerASN: 65551 
      serviceSelector:
        matchExpressions:
          - {key: io.cilium/lb-managed, operator: Exists}

