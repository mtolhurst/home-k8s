apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io 
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    automated: 
      prune: true 
      selfHeal: true
      allowEmpty: false 
  destination:
    namespace: kube-system
    server: {{ .Values.spec.destination.server }}
  project: default
  sources:
    - chart: cilium
      repoURL: https://helm.cilium.io/
      targetRevision: 1.20.0
      helm:
        valuesObject:
          routingMode: native
          ipv4NativeRoutingCIDR: "10.244.0.0/16"
          autoDirectNodeRoutes: true
          # Talos specific path adjustments
          cgroup:
            autoMount:
              enabled: false
            hostRoot: /sys/fs/cgroup

          # Safe capability management for locked-down kernels
          securityContext:
            capabilities:
              ciliumAgent: [NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID, CHOWN, KILL]
              cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
          bpf:
            hostRouting: true
            masquerade: true
          enableIPv4Masquerade: true

          # Complete Kube-Proxy replacement configuration
          kubeProxyReplacement: true
          k8sServiceHost: localhost
          k8sServicePort: 7445

          # Native Routing and BGP configuration
          ipam:
            mode: kubernetes
          bgpControlPlane:
            enabled: true
    - repoURL: {{ .Values.spec.source.repoURL }}
      path: infra/cilium
